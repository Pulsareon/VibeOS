[package]
name = "vibeos-host"
version = "0.1.0"
edition = "2024"
description = "Dependency-free Rust host for VibeOS web, desktop and virtual machines"

[[bin]]
name = "vibeos-host"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vibeos-core = { path = "../core" }
libloading = "0.8"
tempfile = "3"
minifb = "0.27"
