<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeOS</title>
<link rel="stylesheet" href="core/os.css">
</head>
<body>

<div id="desktop">
  <canvas id="bgCanvas"></canvas>
  <div id="desktop-icons"></div>
</div>

<div id="taskbar">
  <div id="vibe-btn-wrap" style="position:relative;">
    <button id="vibe-btn">⚡ VIBE</button>
    <div id="vibe-dropdown" style="display:none;position:absolute;bottom:100%;left:0;margin-bottom:8px;background:rgba(20,20,50,.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.5);">
      <div class="vibe-dd-item" data-action="generate" style="padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;">
        <span>✨</span><span>生成应用</span>
      </div>
      <div style="height:1px;background:var(--border);margin:4px 8px;"></div>
      <div class="vibe-dd-item" data-action="bug" style="padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;">
        <span>🐛</span><span>提交 Bug</span>
      </div>
    </div>
  </div>
  <div class="taskbar-items" id="taskbar-items"></div>
  <div class="taskbar-clock" id="taskbar-clock"></div>
</div>

<div id="vibe-overlay">
  <div id="vibe-modal">
    <div id="vibe-modal-header">⚡ Vibe — 告诉我你想要什么</div>
    <div id="vibe-modal-body">
      <textarea id="vibe-input" placeholder="描述你想要的应用，比如：&#10;• 一个番茄钟&#10;• 天气仪表盘&#10;• 计算器&#10;• 音乐播放器界面&#10;• Markdown 编辑器"></textarea>
      <div id="vibe-suggestions"></div>
      <div id="vibe-actions">
        <button id="vibe-cancel">取消</button>
        <button id="vibe-generate">✨ 生成</button>
      </div>
    </div>
  </div>
</div>

<div id="bug-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;">
  <div id="bug-cli" style="width:560px;max-width:92vw;height:520px;max-height:80vh;background:#0a0a1a;border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 16px 64px rgba(0,0,0,.6),0 0 40px rgba(225,112,85,.1);display:flex;flex-direction:column;">
    <div style="padding:8px 12px;display:flex;align-items:center;gap:8px;background:#111;border-bottom:1px solid #1a1a3e;">
      <span style="width:12px;height:12px;border-radius:50%;background:#e17055;"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#fdcb6e;"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#00b894;"></span>
      <span style="flex:1;text-align:center;font-size:12px;color:#666;font-family:Consolas,monospace;">🐛 BugReporter — VibeOS</span>
      <button id="bug-cli-close" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px;padding:0 4px;">×</button>
    </div>
    <div id="bug-cli-output" style="flex:1;overflow-y:auto;padding:12px;font-family:Consolas,monospace;font-size:13px;line-height:1.7;"></div>
    <div style="padding:8px 12px;border-top:1px solid #1a1a3e;display:flex;align-items:center;gap:8px;">
      <span style="color:#e17055;font-weight:700;">❯</span>
      <input id="bug-cli-input" style="flex:1;border:none;background:transparent;color:#e0e0f0;font-family:Consolas,monospace;font-size:13px;outline:none;" autofocus>
    </div>
  </div>
</div>

<div id="context-menu">
  <div class="ctx-item" data-action="vibe">⚡ Vibe 生成应用</div>
  <div class="ctx-item" data-action="bug">🐛 提交 Bug</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="terminal">🖥️ 终端</div>
  <div class="ctx-item" data-action="notepad">📝 记事本</div>
  <div class="ctx-item" data-action="filemanager">📁 文件管理器</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="settings">⚙️ 设置</div>
</div>

<!-- MiMo 实时聊天窗口 -->
<div id="chat-toggle" style="position:fixed;bottom:60px;right:16px;z-index:9998;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e17055,#fdcb6e);border:none;cursor:pointer;box-shadow:0 4px 16px rgba(225,112,85,.4);font-size:20px;display:flex;align-items:center;justify-content:center;transition:transform .2s;">
  💬
</div>
<div id="chat-window" style="position:fixed;bottom:116px;right:16px;z-index:10000;width:360px;height:480px;border-radius:12px;background:#0a0a1a;border:1px solid rgba(100,100,180,0.3);box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;">
  <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#e17055,#fdcb6e);flex-shrink:0;">
    <div style="width:8px;height:8px;border-radius:50%;background:#0f0;animation:pulse 2s infinite;"></div>
    <span style="font-size:14px;font-weight:700;color:#fff;">MiMo</span>
    <span style="font-size:11px;color:rgba(255,255,255,.7);flex:1;">在线 · 实时监控中</span>
    <button id="chat-close" style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px;">×</button>
  </div>
  <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;"></div>
  <div style="padding:8px 12px;border-top:1px solid rgba(100,100,180,0.2);display:flex;gap:8px;">
    <input id="chat-input" placeholder="和 MiMo 说点什么..." style="flex:1;padding:8px 12px;border-radius:20px;border:1px solid rgba(100,100,180,0.3);background:rgba(20,20,40,.8);color:#e0e0f0;font-size:13px;outline:none;">
    <button id="chat-send" style="width:34px;height:34px;border-radius:50%;border:none;background:linear-gradient(135deg,#e17055,#fdcb6e);color:#fff;cursor:pointer;font-size:14px;">➤</button>
  </div>
</div>

<!-- 核心 OS 引擎 (稳定，不随意修改) -->
<script src="core/os.js"></script>
<!-- 实时代码生成引擎 -->
<script src="apps/vibe-engine.js"></script>
<!-- 内置应用 (预装应用生成器) -->
<script src="apps/builtin.js"></script>
<!-- 应用注册表 (匹配+管理用户应用) -->
<script src="apps/registry.js"></script>

</body>
</html>
